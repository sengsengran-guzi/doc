# 字段表 SSOT —— 谷子宇宙拼团（日本代购一期）
# 锚前缀 FIELD:<table>.<column>。改字段只改这一处。
# 栈：RuoYi-Vue-Plus (MyBatis-Plus + Flyway + MySQL) / plus-ui (Vue3 TS) / uni-app

kind: field

type_map:
  id:        { ddl: "BIGINT",        entity: "Long",          ts: "string" }
  str:       { ddl: "VARCHAR",       entity: "String",        ts: "string" }
  text:      { ddl: "MEDIUMTEXT",    entity: "String",        ts: "string" }
  int:       { ddl: "INT",           entity: "Integer",       ts: "number" }
  bigint:    { ddl: "BIGINT",        entity: "Long",          ts: "number" }
  bool:      { ddl: "TINYINT(1)",    entity: "Boolean",       ts: "boolean" }
  date:      { ddl: "DATE",          entity: "LocalDate",     ts: "string" }
  datetime:  { ddl: "DATETIME(3)",   entity: "LocalDateTime", ts: "string" }
  dict:      { ddl: "VARCHAR",       entity: "String",        ts: "string" }
  decimal:   { ddl: "DECIMAL(12,6)", entity: "BigDecimal",    ts: "string" }

# ruoyi TenantEntity 自动填充的公共字段全集。DDL form 的 accept 断言就断这一整套。
common_field_blocks:
  audit:
    - { name: create_by,   type: bigint,   nullable: true,  comment: "创建人" }
    - { name: create_time, type: datetime, nullable: true,  comment: "创建时间" }
    - { name: update_by,   type: bigint,   nullable: true,  comment: "更新人" }
    - { name: update_time, type: datetime, nullable: true,  comment: "更新时间" }
    - { name: create_dept, type: bigint,   nullable: true,  comment: "创建部门（最易漏，漏建 INSERT 直接报 Unknown column）" }
    - { name: del_flag,    type: str, length: 1, nullable: false, default: "0", comment: "逻辑删除(0存在/2删除)" }
  tenant:
    - { name: tenant_id,   type: str, length: 20, nullable: false, default: "1001", comment: "租户号；INSERT 不显式赋值，走 InjectionMetaObjectHandler.insertFill" }

tables:

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_event
    comment: "拼团场（一个时间段的一次快闪活动）"
    module: ruoyi-gz-jp
    id_range: "menu 14001 场管理 + 14002-14009 按钮"
    migration: "V<yyyyMMddHHmm>__GZ-JP-101-create-gz_jp_event.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: event_no, type: str, length: 32, nullable: false, unique: uk_event_no, comment: "场编号 EVT-yyyyMMdd-6位" }
      - { name: name, type: str, length: 128, nullable: false, comment: "场名称" }
      - { name: cover_image_id, type: id, nullable: true, comment: "封面图，FK gz_file_object.id（禁裸 url）" }
      - { name: description, type: str, length: 512, nullable: true, comment: "场简介" }
      - { name: start_time, type: datetime, nullable: false, comment: "开场时间" }
      - { name: end_time, type: datetime, nullable: false, comment: "闭场时间；到点后读时惰性判定为已结束，不依赖 cron" }
      - { name: status, type: dict, length: 16, dict: gz_jp_event_status, nullable: false, default: "draft", comment: "场状态 draft未开始/open进行中/closed已结束" }
      - { name: sort_no, type: int, nullable: false, default: "0", comment: "排序号，越小越前" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version" }
    indexes:
      - { name: idx_status_time, cols: [tenant_id, status, start_time] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_product
    comment: "拼团商品（挂在场下）"
    module: ruoyi-gz-jp
    id_range: "menu 14010 商品管理 + 14011-14019 按钮"
    migration: "V<yyyyMMddHHmm>__GZ-JP-102-create-gz_jp_product.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: product_no, type: str, length: 32, nullable: false, unique: uk_product_no, comment: "商品编号 JPP-yyyyMMdd-6位" }
      - { name: event_id, type: id, nullable: false, comment: "所属场 FK gz_jp_event.id（逻辑关联，不建物理外键）" }
      - { name: name, type: str, length: 128, nullable: false, comment: "商品名称" }
      - { name: main_image_id, type: id, nullable: false, comment: "主图 FK gz_file_object.id" }
      - { name: gallery_image_ids, type: str, length: 512, nullable: true, comment: "图集，逗号分隔 file id。一期用图集承载详情，不做富文本" }
      - { name: price_cent, type: bigint, nullable: false, comment: "售价（分）。★ 全包邮，此价即客人最终支付价，不叠加运费" }
      - { name: delivery_date_text, type: str, length: 64, nullable: true, comment: "预计到货时间（文本，如「8月下旬」，谷圈惯用模糊表述）" }
      - { name: notice_text, type: str, length: 1024, nullable: true, comment: "额外注意事项（甲方明确要求的独立字段，下单前须显著展示，不混进图集）" }
      - { name: status, type: dict, length: 16, dict: gz_jp_product_status, nullable: false, default: "off_shelf", comment: "商品状态 on_shelf上架/off_shelf下架。★ 一期无库存字段（集单预订不限量）" }
      - { name: sort_no, type: int, nullable: false, default: "0", comment: "场内排序号" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version" }
    indexes:
      - { name: idx_event_status, cols: [tenant_id, event_id, status, sort_no] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_cart_item
    comment: "购物车项（客人一次可选几十款，跨场共存）"
    module: ruoyi-gz-jp
    id_range: "无 menu（纯 C 端）"
    migration: "V<yyyyMMddHHmm>__GZ-JP-201-create-gz_jp_cart_item.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: user_id, type: id, nullable: false, comment: "所属用户 FK gz_user.id" }
      - { name: product_id, type: id, nullable: false, unique: uk_user_product, comment: "商品 FK gz_jp_product.id" }
      - { name: qty, type: int, nullable: false, default: "1", comment: "数量" }
    indexes:
      - { name: idx_user, cols: [tenant_id, user_id] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_order
    comment: "拼团订单（订单级只管钱，履约状态在商品行上）"
    module: ruoyi-gz-jp
    id_range: "menu 14020 订单管理 + 14021-14029 按钮"
    migration: "V<yyyyMMddHHmm>__GZ-JP-103-create-gz_jp_order.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: order_no, type: str, length: 32, nullable: false, unique: uk_order_no, comment: "订单号 JPO-yyyyMMdd-6位，= gz_pay_transaction.business_order_no" }
      - { name: user_id, type: id, nullable: false, comment: "下单用户 FK gz_user.id" }
      - { name: total_amount_cent, type: bigint, nullable: false, comment: "订单总额（分）= Σ 行金额。★ 无运费项（全包邮），后端重算不信前端" }
      - { name: business_status, type: dict, length: 20, dict: gz_jp_order_status, nullable: false, default: "created", comment: "订单状态 created待支付/paid已支付/cancelled已取消/partial_refunded部分退款/refunded已退款" }
      - { name: pay_transaction_id, type: id, nullable: true, unique: uk_pay_transaction, comment: "支付流水 FK gz_pay_transaction.id" }
      - { name: address_snapshot_json, type: text, nullable: false, comment: "收货地址快照（下单锁定，后续改地址不影响已下单）" }
      - { name: user_note, type: str, length: 255, nullable: true, comment: "客人备注" }
      - { name: paid_time, type: datetime, nullable: true, comment: "支付时间" }
      - { name: cancelled_time, type: datetime, nullable: true, comment: "取消时间" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version" }
    indexes:
      - { name: idx_user_status, cols: [tenant_id, user_id, business_status] }
      - { name: idx_paid_time, cols: [tenant_id, paid_time] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_order_item
    comment: "订单商品行 —— ★ 本域核心表：履约状态、运单号、退款全在这一层"
    module: ruoyi-gz-jp
    id_range: "无独立菜单（展示在履约看板 14030 段内）"
    migration: "V<yyyyMMddHHmm>__GZ-JP-103-create-gz_jp_order_item.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: order_id, type: id, nullable: false, comment: "所属订单 FK gz_jp_order.id" }
      - { name: user_id, type: id, nullable: false, comment: "冗余下单用户 id —— 履约看板主视图按客人聚合且跨订单，避免每次 join 订单表" }
      - { name: product_id, type: id, nullable: true, comment: "拼团商品 FK gz_jp_product.id。★ 二期改可空（ADR-0025 §5，新迁移 ALTER）：source=batch 必填 / source=snap 恒空，应用层保证" }
      - { name: snap_item_id, type: id, nullable: true, comment: "★ 二期新增：代切商品 FK gz_jp_snap_item.id。source=snap 必填 / source=batch 恒空" }
      - { name: product_snapshot_json, type: text, nullable: false, comment: "下单时商品快照（名/图/价/注意事项），商品后续改动不影响已下单。source=snap 时另含 snap 段：externalId / titleJa / titleZh / priceJpy / ratePer100Jpy / markupRatio / fixedFeeCent / estShippingCent / gateResult / gateReason / shippingPayer / conditionText / mainImageId / mainImageUrl / quoteId / quotedAt（mainImageUrl为转存失败兜底的原图URL，读侧必须改写为备案CDN/自有图片代理地址）；金额和汇率保留报价锁定值，gateResult 为提交时保守准入：报价或实时复查任一 manual 则 manual，实时 blocked 拒单（REQ-SNAP-021 锁价凭据）" }
      - { name: qty, type: int, nullable: false, comment: "数量" }
      - { name: unit_price_cent, type: bigint, nullable: false, comment: "下单时单价（分）" }
      - { name: amount_cent, type: bigint, nullable: false, comment: "行金额（分）= unit_price_cent × qty。★ 行级退款按此金额退" }
      - { name: source, type: dict, length: 16, dict: gz_jp_item_source, nullable: false, default: "batch", comment: "来源 batch=拼团 / snap=代切（二期字典加值）。source=snap 的订单一单只有这一行（REQ-SNAP-035）" }
      - { name: fulfill_status, type: dict, length: 24, dict: gz_jp_fulfill_status, nullable: false, default: "purchasing", comment: "履约状态 purchasing购买中/purchase_failed购买失败/await_seller_ship等待官方发货/jp_shipped日本仓库已发货/customs清关中/cn_sorting国内分拣中/delivered发货完毕。★ 允许跳过中间态（现货无 await_seller_ship）" }
      - { name: carrier_code, type: dict, length: 32, dict: gz_express_carrier, nullable: true, comment: "国内快递编码（复用现有 gz_express_carrier 字典），置 delivered 时必填" }
      - { name: tracking_no, type: str, length: 64, nullable: true, comment: "国内运单号，员工手工填。★ 本列即包裹标识——同单号的行属同一包裹，不另建包裹表" }
      - { name: shipped_at, type: datetime, nullable: true, comment: "发货时间（置 delivered 时写入）" }
      - { name: refund_status, type: dict, length: 20, dict: gz_jp_refund_status, nullable: true, comment: "退款状态 refunding退款中/refunded已退款/refund_failed退款失败。仅 purchase_failed 行会有值" }
      - { name: refund_amount_cent, type: bigint, nullable: true, comment: "已退金额（分），正常 = amount_cent" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version" }
    indexes:
      - { name: idx_user_fulfill, cols: [tenant_id, user_id, fulfill_status] }
      - { name: idx_order, cols: [tenant_id, order_id] }
      - { name: idx_tracking, cols: [tenant_id, tracking_no] }
      - { name: idx_snap_item, cols: [tenant_id, snap_item_id] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_user
    comment: "★ 既有表，本期仅 ALTER 加 app_id —— 两个小程序的 openid 隔离"
    module: ruoyi-gz-common
    id_range: "既有"
    migration: "V<yyyyMMddHHmm>__GZ-SYS-024-alter-gz_user-add-app_id.sql"
    common_fields: []
    fields:
      - { name: app_id, type: str, length: 32, nullable: false, default: "wx2f8b93e09703f07d", comment: "★ 新增列：所属小程序 appid。唯一键由 (tenant_id, openid) 改为 (tenant_id, app_id, openid)；存量行回填现小程序 appid" }
      - { name: openid, type: str, length: 64, nullable: false, unique: uk_tenant_app_openid, comment: "既有列，唯一约束变更为含 app_id" }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_refund
    comment: "拼团行级退款单（GZ-JP-107 建，一期漏登记 SSOT，二期补登）—— 只列二期改动与关键列"
    module: ruoyi-gz-jp
    id_range: "无独立菜单（既有按钮 14035 退款单查询 / 14036 退款重新发起，在履约看板 14030 下）"
    migration: "既有 V202608071102；二期改动 = V<yyyyMMddHHmm>__GZ-SNAP-xxx-alter-gz_jp_refund-add-refund_type.sql"
    common_fields: []
    fields:
      - { name: order_item_id, type: id, nullable: false, comment: "退的是哪一行。★ 唯一键二期由 uk_order_item(tenant_id, order_item_id) 改为 uk_item_type(tenant_id, order_item_id, refund_type)（ADR-0025 §5，Kevin 2026-10-03 确认）" }
      - { name: refund_type, type: dict, length: 20, dict: gz_jp_refund_type, nullable: false, default: "purchase_failed", unique: uk_item_type, comment: "★ 二期新增：purchase_failed 购买失败全额（存量行回填此值）/ shipping_diff 到付预估运费多退（REQ-SNAP-025）。一行至多各一条。★ 只有 purchase_failed 会写订单行 refund_status / refund_amount_cent 并参与订单 business_status rollup；shipping_diff 发起与回调都不碰订单行、不参与 rollup（FLOW:F-JP-08.step2）" }
      - { name: refund_amount_cent, type: bigint, nullable: false, comment: "本次退款金额（分）。purchase_failed = 该行 amount_cent − 该行已成功的 shipping_diff 金额" }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_snap_item
    comment: "代切商品（煤炉商品在 ruoyi 侧的缓存副本 + 孤品互斥锁）。★ 权威是煤炉本身，本表可能过期 —— 下单前必须实时查（OWN:mercari_item_live）"
    module: ruoyi-gz-jp
    id_range: "无独立菜单"
    migration: "V<yyyyMMddHHmm>__GZ-SNAP-xxx-create-gz_jp_snap_item.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: platform, type: dict, length: 16, dict: gz_jp_snap_platform, nullable: false, default: "mercari", unique: uk_platform_external, comment: "来源平台，二期只有 mercari" }
      - { name: external_id, type: str, length: 32, nullable: false, unique: uk_platform_external, comment: "煤炉商品 ID（m+数字）—— 跨系统稳定业务键" }
      - { name: title_ja, type: str, length: 255, nullable: false, comment: "日文原标题" }
      - { name: title_zh, type: str, length: 255, nullable: true, comment: "机翻中文标题（REQ-SNAP-016）" }
      - { name: price_jpy, type: bigint, nullable: false, comment: "最近一次实时查询的日元价（整数日元）" }
      - { name: item_status, type: dict, length: 16, dict: gz_jp_snap_item_status, nullable: false, comment: "煤炉侧状态 on_sale在售/trading交易中/sold_out已售出/deleted已删除" }
      - { name: shipping_payer, type: dict, length: 16, dict: gz_jp_snap_shipping_payer, nullable: false, comment: "运费承担 seller卖家包邮/buyer到付（REQ-SNAP-024 判定依据）" }
      - { name: category_id, type: str, length: 32, nullable: true, comment: "煤炉分类 ID（白名单判定，REQ-SNAP-019）" }
      - { name: condition_text, type: str, length: 64, nullable: true, comment: "成色（日文原文，如「新品、未使用」）" }
      - { name: seller_id, type: str, length: 64, nullable: true, comment: "煤炉卖家 ID" }
      - { name: gate_result, type: dict, length: 16, dict: gz_jp_snap_gate, nullable: false, comment: "准入 auto可自动下单/manual转人工/blocked不可购买（REQ-SNAP-022/023/024/048）" }
      - { name: gate_reason, type: str, length: 64, nullable: true, comment: "命中的规则（如 kw:専用 / proxy_refuse:<命中词>@title|desc|profile / kw:コメント必須 / shipping:buyer / category / blacklist / shops），admin 与人工队列展示" }
      - { name: main_image_id, type: id, nullable: true, comment: "下单时转存的主图 FK gz_file_object.id（未下单过为空）" }
      - { name: raw_json, type: text, nullable: true, comment: "最近一次详情原始返回（审计 / 排障）" }
      - { name: fetched_at, type: datetime, nullable: false, comment: "最近一次实时查询时间。mp详情公共投影为可空fetchedAt（epoch毫秒，服务端按Asia/Shanghai转换既有DATETIME），仅取该字段，不用客户端取数时刻冒充快照时间；旧调用缺值时保持null" }
      - { name: active_order_item_id, type: id, nullable: true, comment: "★ 孤品互斥锁：占用中的订单行 FK gz_jp_order_item.id；提交订单时 FOR UPDATE 判定，关单 / 失败 / 退款时置空（REQ-SNAP-041）" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version" }
    indexes:
      - { name: idx_active_order_item, cols: [tenant_id, active_order_item_id] }

  # ══════════════════════════════════════════════════════════════════
  - table: gz_jp_snap_purchase
    comment: "代切下单任务 + 煤炉交易跟踪（与 source=snap 的订单行 1:1）。purchase_status 管「买没买到」、trade_status 管「买到之后到评价」，双状态机正交（ADR-0007 范式）"
    module: ruoyi-gz-jp
    id_range: "menu 14050 代切下单（人工代买队列 / 交易看板）"
    migration: "V<yyyyMMddHHmm>__GZ-SNAP-xxx-create-gz_jp_snap_purchase.sql"
    common_fields: [audit, tenant]
    fields:
      - { name: id, type: id, nullable: false, comment: "主键" }
      - { name: order_item_id, type: id, nullable: false, unique: uk_order_item, comment: "FK gz_jp_order_item.id（支付回调重复推送靠此唯一键幂等）" }
      - { name: order_no, type: str, length: 32, nullable: false, comment: "冗余订单号 = 跨系统幂等键（POST /v1/purchases 的 order_no）" }
      - { name: snap_item_id, type: id, nullable: false, comment: "FK gz_jp_snap_item.id" }
      - { name: external_id, type: str, length: 32, nullable: false, comment: "冗余煤炉商品 ID" }
      - { name: locked_price_jpy, type: bigint, nullable: false, comment: "锁定日元价 = 下单时报价；自动下单时当前价高于它即 failed(price_up)（REQ-SNAP-027）" }
      - { name: mode, type: dict, length: 16, dict: gz_jp_snap_mode, nullable: false, comment: "auto自动/manual人工。入队时定，风控暂停时 auto 可批量改 manual" }
      - { name: purchase_status, type: dict, length: 20, dict: gz_jp_snap_purchase_status, nullable: false, comment: "queued待下单/executing下单中/unknown结果不明(对账中)/manual_pending待人工/success已买到/failed未买到" }
      - { name: manual_reason, type: str, length: 64, nullable: true, comment: "转人工原因：gate:<规则> / reconcile_sold（对账满 3 轮未查到，且最后一次看到商品已不在售——大概率要核实是否其实买到了）/ reconcile_exhausted（对账满 3 轮未查到，商品仍在售或对账调用失败）/ auto_paused（总开关关闭）/ no_account（无健康账号或都到日限；仅冷却中不转人工）/ shipping_changed（下单前发现运费改到付）/ account_unpayable（采购账号余额不足或付款方式不可用，该账号同时停用）" }
      - { name: fail_reason, type: dict, length: 24, dict: gz_jp_snap_fail_reason, nullable: true, comment: "sold_out已售出/deleted已下架/price_up涨价/manual_rejected人工谈不成/seller_cancel卖家取消/inspect_ng验货不通过" }
      - { name: reconcile_count, type: int, nullable: false, default: "0", comment: "对账次数，满 3 次转人工（REQ-SNAP-029）" }
      - { name: next_action_at, type: datetime, nullable: true, comment: "调度：下次执行 / 对账时间" }
      - { name: account_code, type: str, length: 32, nullable: true, comment: "执行账号 FK gz_jp_snap_account.account_code（人工 = 员工所用账号）" }
      - { name: mercari_txn_id, type: str, length: 64, nullable: true, comment: "煤炉交易号（success 必填）" }
      - { name: actual_price_jpy, type: bigint, nullable: true, comment: "实际成交日元价（低于锁定价差价不退，仅审计，REQ-SNAP-028）" }
      - { name: actual_shipping_jpy, type: bigint, nullable: true, comment: "到付实际运费（日元）：货到转运仓时日本员工点「已到仓」一并填（着払い到仓才付、才知道金额），用于多退少不补（REQ-SNAP-025）；包邮商品恒空" }
      - { name: trade_status, type: dict, length: 20, dict: gz_jp_snap_trade_status, nullable: false, default: "none", comment: "none未成交/await_ship待卖家发货/shipped卖家已发货/arrived已到仓/rated已评价/returned已退货/cancelled交易取消（卖家取消、已发货后丢件、事务局取消，可从 await_ship 或 shipped 进入）" }
      - { name: arrived_at, type: datetime, nullable: true, comment: "到仓时间" }
      - { name: rate_deadline_at, type: datetime, nullable: true, comment: "评价期限 = arrived_at + rateDeadlineHours（REQ-SNAP-034）" }
      - { name: rated_at, type: datetime, nullable: true, comment: "员工点「已评价」时间" }
      - { name: evidence_file_ids, type: str, length: 512, nullable: true, comment: "下单证据（截图 / 页面快照）file id 逗号分隔，usage_type=snap_evidence（REQ-SNAP-043）" }
      - { name: manual_operator, type: bigint, nullable: true, comment: "人工处理人 sys_user.user_id" }
      - { name: manual_note, type: str, length: 512, nullable: true, comment: "人工备注" }
      - { name: last_error, type: str, length: 512, nullable: true, comment: "最近一次调用日本服务的错误（不静默吞）" }
      - { name: executed_at, type: datetime, nullable: true, comment: "开始执行时间" }
      - { name: result_at, type: datetime, nullable: true, comment: "落终态（success / failed）时间 —— REQ-SNAP-038「1 分钟可见」按 paid_time→result_at 量" }
      - { name: version, type: int, nullable: false, default: "0", comment: "乐观锁版本号 @Version（抢任务用条件更新）" }
    indexes:
      - { name: idx_status_next, cols: [tenant_id, purchase_status, next_action_at] }
      - { name: idx_trade, cols: [tenant_id, trade_status, rate_deadline_at] }

