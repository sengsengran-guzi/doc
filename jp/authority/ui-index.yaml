# UI 权威索引 —— 谷子宇宙拼团（日本代购一期）
# 锚前缀 UI:<page-id>（区块 UI:<page-id>.<block>）
# mp = 新小程序 code/main/miniapp-jp/；admin = 既有 plus-ui

kind: ui

records:

  # ══════════════════════════════════════════════════════════════════
  - id: UI:global.theme
    title: 视觉基调（全局设计 token）
    status: active
    body: |
      **方案 A · 延续现有「暖白清爽」** —— 2026-08-06 Kevin 拍板（design-options/00-theme.md）。

      直接复用现有 miniapp 的 c-tokens，两个小程序视觉一致：同一批客人在拼豆/回收和拼团之间
      来回跑，视觉一致降低认知成本；省下的时间留给业务链路。

      token 真源 = `code/main/miniapp-jp/src/style/c-tokens.scss` + `uno.config.ts`（从现有 miniapp 复制，不改值，两处必须一致）：
      主色 = 品牌绿 #33b36b（令牌名沿用 --c-red）· 按下态 #2aa05e · 浅底 #e5f6ec · 底 = 暖中性 · 卡片白 · 柔和扩散阴影 · 圆角。
      具体数值一律以 c-tokens.scss 为准，本条不复写数值（复写会和真源漂移）。tabbar 选中色 #33B36B。

      被否决：B 日系杂志（克制留白，气质更贴日本代购但要重写 token）、
      C 谷圈甜系（高饱和圆润，客群贴合度最高但与现有小程序视觉断裂）。
      两者均 +0.5~1 天且需新写 token；未来若甲方要独立品牌视觉可复活。

      ★ 组件禁止硬编码 hex，一律走 token 变量。
    related_reqs: [REQ-SYS-001, REQ-SYS-005]

  # ══════════════════════════════════════════════════════════════════
  # 小程序（mp）—— 客人侧
  # ══════════════════════════════════════════════════════════════════

  - id: UI:mp.home
    title: 首页（聚合）
    status: active
    body: |
      tabbar 第一格。自上而下三块：轮播 banner → 进行中的场 → 我的订单快捷入口。
      banner 走 sys_config 后台可配（沿用现有 miniapp 的 gz.home.banners 做法）；
      一期无运营内容时降级为单张默认图，不留空白位。
      场区块纵向卡片流，分「进行中 / 即将开始 / 已结束」三组，进行中置顶，点卡片进场。
    steps:
      - id: UI:mp.home.banner
        form: 轮播
        note: sys_config 可配；无配置时显示单张默认图，不显示空轮播
      - id: UI:mp.home.event_card
        form: 卡片
        note: 封面图 16:9 + 场名 + 时间范围 + 状态角标（进行中=主色，即将开始/已结束=灰）
      - id: UI:mp.home.order_entry
        form: 快捷入口
        note: 「我的订单」入口 + 待收货款数角标，点进 UI:mp.order_list
    related_reqs: [REQ-EVENT-001, REQ-SYS-001]

  - id: UI:mp.event_detail
    title: 场详情 · 商品列表
    status: active
    body: |
      顶部场信息（封面/名称/倒计时或已结束提示），下方商品两列网格，上拉加载。
      商品卡：主图 + 名称 + 价格 + 预计到货。点进商品详情。
      场已结束时：商品仍可浏览，加购与下单入口置灰并提示「本场已结束」。
    steps:
      - id: UI:mp.event_detail.product_grid
        form: 两列网格
        note: 无筛选无排序（一期极简）；场内商品量级预计几十到上百，上拉分页
    related_reqs: [REQ-EVENT-001, REQ-PROD-001]

  - id: UI:mp.product_detail
    title: 商品详情
    status: active
    body: |
      顶部主图轮播（主图 + 图集）→ 名称 → 价格（大字，标注「包邮」）→ 预计到货时间 →
      ★ 注意事项（独立醒目区块，不折叠）→ 底部固定 CTA「加入购物车」。
      一期不做富文本详情，商品说明用图集承载。
    steps:
      - id: UI:mp.product_detail.notice
        form: 醒目区块
        note: >
          ★ 甲方明确要求的「额外注意事项」。必须在 CTA 之上、默认展开不折叠，
          底色区分于正文。这是下单前的风险告知位。
      - id: UI:mp.product_detail.cta
        form: 底部固定条
        note: 价格 + 数量 stepper + 「加入购物车」。场已结束时置灰
    related_reqs: [REQ-PROD-003, REQ-PROD-004, REQ-PROD-005, REQ-ORDER-004]

  - id: UI:mp.cart
    title: 购物车
    status: active
    body: |
      按场分组列出购物车项：商品图 + 名 + 单价 + 数量 stepper + 删除 + 单选框。
      底部：全选 + 合计金额（标注「已包邮」）+ 「去结算」。
      失效项（场已结束 / 商品已下架）置灰并标「已失效」，不计入合计、不可勾选。
    steps:
      - id: UI:mp.cart.group
        form: 按场分组
        note: 跨场商品可共存于同一购物车，同一订单可含多场商品
      - id: UI:mp.cart.summary
        form: 底部固定条
        note: ★ 只有商品合计一行，**无运费行**（全包邮）
    related_reqs: [REQ-ORDER-005, REQ-ORDER-004]

  - id: UI:mp.order_confirm
    title: 下单确认
    status: active
    body: |
      收货地址（选择/新增）→ 商品清单（只读）→ 备注输入 → 合计 → 「提交订单」→ 拉起微信支付。
      提交前后端重算金额并复校：场仍 open、商品仍 on_shelf、价格未变；不一致则退回购物车提示。
    steps:
      - id: UI:mp.order_confirm.summary
        form: 金额区
        note: ★ 只有「商品合计」与「实付」两行，**无运费行**
    related_reqs: [REQ-ORDER-003, REQ-ORDER-004, REQ-ORDER-006]

  - id: UI:mp.order_list
    title: 我的订单 · 列表
    status: active
    body: |
      按状态分 tab：全部 / 待支付 / 进行中 / 已完成。
      订单卡：订单号 + 下单时间 + 前 N 个商品缩略图 + 商品款数 + 实付金额 + 订单状态。
      点进详情。
    related_reqs: [REQ-FULFILL-001]

  - id: UI:mp.order_detail
    title: 我的订单 · 详情（★ 一期客人侧最重要的页）
    status: active
    body: |
      订单头（订单号/下单时间/实付/收货地址）+ **商品按履约状态分组**展示。
      ★ 分组而非平铺：一单可含 30 款，平铺时页面极长且同一运单号会重复出现十几次。
      组按状态链顺序排列（发货完毕 → 国内分拣中 → 清关中 → 日本仓库已发货 →
      等待官方发货 → 购买中 → 购买失败），组头显示「<状态> N 款」。
      ★ 不出现任何「包裹」字样 —— 客人不感知打包方式（REQ-FULFILL-006）。
    steps:
      - id: UI:mp.order_detail.status_group
        form: 分组区块
        note: >
          组头 = 状态名 + 该状态款数。已发货组的组头下方紧跟快递中文名 + 运单号 + 复制按钮
          （同一包裹共用一个单号，**只显示一次**，这是分组相对平铺的主要收益）。
          同一状态但运单号不同时，按运单号再分子组
      - id: UI:mp.order_detail.item_row
        form: 组内商品行
        note: 图 + 名 + 数量 + 金额。行内不再重复状态标签（状态已由组头承载）
      - id: UI:mp.order_detail.failed_group
        form: 购买失败组
        note: 排在最后，每行标「已退款 ¥xx」
    related_reqs: [REQ-FULFILL-001, REQ-FULFILL-002, REQ-FULFILL-003, REQ-FULFILL-004, REQ-FULFILL-005, REQ-FULFILL-006]

  # ══════════════════════════════════════════════════════════════════
  # Admin（plus-ui）—— 店员侧。走 ruoyi/Element Plus 默认审美，不套 mp 设计系统
  # ══════════════════════════════════════════════════════════════════

  - id: UI:admin.event
    title: 场管理
    status: active
    body: |
      标准 ruoyi CRUD 列表 + 新建/编辑 Dialog。
      列：场编号 / 名称 / 起止时间 / 状态 / 商品数 / 操作（编辑、开场、关场、删除）。
      表单：名称 / 封面（ImageUpload）/ 简介 / 起止时间（datetime range）/ 排序号。
    related_reqs: [REQ-EVENT-001]

  - id: UI:admin.product
    title: 商品管理
    status: active
    body: |
      标准 ruoyi CRUD，顶部按场筛选。列：编号 / 主图 / 名称 / 所属场 / 价格 / 预计到货 / 状态 / 操作。
      支持多选批量上下架。表单：所属场 / 名称 / 主图 / 图集 / 价格 / 预计到货文本 / **注意事项** / 排序号。
      一期不做 Excel 导入导出、不做富文本编辑器、无库存字段。
    related_reqs: [REQ-PROD-001, REQ-PROD-003, REQ-PROD-004, REQ-PROD-005]

  - id: UI:admin.order
    title: 订单管理
    status: active
    body: |
      只读查询列表 + 详情抽屉。列：订单号 / 客人 / 款数 / 实付 / 订单状态 / 下单时间。
      详情抽屉展示订单头 + 逐行商品及其履约状态（只读，推进操作在履约看板做）。
    related_reqs: [REQ-ORDER-006, REQ-FULFILL-001]

  - id: UI:admin.fulfill_board
    title: 履约看板（★ 一期店员侧最重要的页）
    status: active
    body: |
      本域核心操作页。**主视图按客人聚合**（打包决策是「这个客人有哪些货到齐了」，且可跨订单）。
      顶部筛选：客人 / 履约状态 / 场 / 下单时间段。
      表格行 = 订单商品行（不是订单）：客人 / 商品 / 数量 / 所属订单 / 当前状态 / 运单号。
      多选框 + 顶部批量操作条：「批量推进到 <下一状态>」「批量发货（填单号）」「批量标记购买失败」。
    steps:
      - id: UI:admin.fulfill_board.batch_advance
        form: 批量操作条
        note: >
          勾一批 → 选目标状态 → 提交。★ 允许跳过中间态（现货直接跳到日本仓库已发货）。
          一期不做回退。批量接口做分页与单次条数上限（一个客人可能 30+ 行）
      - id: UI:admin.fulfill_board.batch_ship
        form: 批量发货弹窗
        note: >
          勾一批 → 弹窗选快递公司（gz_express_carrier 字典）+ 填一个运单号 → 提交。
          这批行一起置 delivered 并共用该单号。★ 单号即包裹标识
      - id: UI:admin.fulfill_board.mark_failed
        form: 批量操作
        note: >
          勾一批 → 标记购买失败 → 二次确认（会触发真实退款）→ 按行金额发起微信部分退款
    related_reqs: [REQ-FULFILL-001, REQ-FULFILL-002, REQ-FULFILL-003, REQ-FULFILL-004, REQ-FULFILL-005, REQ-FULFILL-006, REQ-FULFILL-007]

  # ══════════════════════════════════════════════════════════════════
  # 二期 · 代切（煤炉）
  # ══════════════════════════════════════════════════════════════════

  - id: UI:mp.snap_search
    title: 代切 · 搜索与结果（★ 二期客人侧入口页）
    status: active
    body: |
      **方案 B（Kevin 2026-10-03 选定）**：tabbar 由两格改三格「首页 / 煤炉 / 我的」，煤炉 tab 即本页（tabbar 页，不是二级页）。
      首页 = 拼团（逛甲方上架的场），煤炉 = 代切（自己搜煤炉二手孤品），两种找货方式各占一个入口。
      空态（未输入）：热门词 chips（取 gz_jp_snap_term 中 term_type=ip、enabled=1 的前 12 条，按 sort_no）+ 贴链接提示。
      一个输入框同时接受中文 / 日文关键词与煤炉链接 / 商品 ID（粘贴即识别并直跳详情）；
      结果为商品网格（主图 + 中文标题 + 人民币价 + 日元小字），只出在售且过了白名单 / 黑名单的商品；
      上拉分页；日本服务不可用时显示最近缓存或「煤炉暂时访问不了」空态，不白屏。
    steps:
      - id: UI:mp.snap_search.input
        form: 搜索框
        note: 支持粘贴识别 jp.mercari.com/item/m\d+、m\d+ 与 App 分享短链 merc.li；粘贴煤炉 Shops 链接提示「暂不支持煤炉 Shops 商品」；空态下展示热门词（取词表 term_type=ip 前 N 个）
      - id: UI:mp.snap_search.result_grid
        form: 两列网格
        note: 卡片 = 主图 1:1 + 中文标题两行截断 + 人民币价（主色）+ 日元价（次要色小字）；转人工商品角标「需人工确认」
      - id: UI:mp.snap_search.sort
        form: 排序切换
        note: 新上架 / 价格低→高 / 价格高→低（透传煤炉排序参数）
    related_reqs: [REQ-SNAP-003, REQ-SNAP-012, REQ-SNAP-013, REQ-SNAP-014, REQ-SNAP-016, REQ-SNAP-019, REQ-SNAP-040]

  - id: UI:mp.home.snap_entry
    title: 首页 · 代切入口
    status: active
    body: |
      **方案 B（Kevin 2026-10-03 选定）**：首页不加代切入口，代切入口 = tabbar 中间新增的「煤炉」格（pages.json tabBar.list
      由 [首页, 我的] 改为 [首页, 煤炉, 我的]；新增一套 tabbar 图标 static/tabbar/mercari.png / mercariHL.png，AI 按现有 home / me 的线性风格与尺寸画，
      选中态走品牌绿，上线前甲方可替换（REQ-SNAP-045））。
      首页保持一期形态不变（拼团场列表为主体）。被否决：A 首页搜索框（搜索框挂在场列表上会被当成「搜场」）、
      C 首页热搜卡片（首页可用性会依赖日本服务）。
    related_reqs: [REQ-SNAP-003, REQ-SNAP-012, REQ-SNAP-045]

  - id: UI:mp.snap_detail
    title: 代切 · 商品详情（★ 二期客人侧最重要的页）
    status: active
    body: |
      **方案 A（Kevin 2026-10-03 选定）**：到手价大字 + 小字「煤炉原价 ¥x 円」+「价格说明」抽屉（商品价 / 代切服务费 / 到付预估运费三行，
      **不显示汇率与加价比例**）。
      进入即实时查一次（顶部显示「实时价格 · x 秒前」，x 由 gz_jp_snap_item.fetched_at 算出）；中文标题可展开日文原文；
      价格区 = 人民币到手价（大字）+「煤炉原价 ¥x 円」（小字）+「价格说明」入口；★ 页面任何位置都不出现汇率与加价比例；
      成色 / 运费承担 / 卖家 / 描述（机翻，可看原文）；底部固定条「立即购买」（不进购物车，REQ-SNAP-035）。
      三种准入态：auto = 正常按钮；manual = 按钮可点 + 说明「需日本员工先和卖家确认，付款后人工处理，谈不成全额退款」；
      blocked / 非在售 = 按钮置灰 + 原因（如「卖家不接受代购」「该商品已被预定」「暂不支持该分类」「已售出」）。
    steps:
      - id: UI:mp.snap_detail.price
        form: 价格区
        note: >
          报价有效期内价格不变；过期后重新进入或下拉刷新重报。「价格说明」抽屉三行：商品价（= 日元价按报价换算后的人民币，
          已含加价，不拆）/ 代切服务费 / 到付预估运费（仅到付商品，附「多退少不补」）；三行之和 = 到手价
      - id: UI:mp.snap_detail.gate
        form: 准入提示条
        note: 三态文案见 body；文案走 i18n
      - id: UI:mp.snap_detail.cta
        form: 底部固定条
        note: 「立即购买」→ UI:mp.order_confirm（snap 模式）
    related_reqs: [REQ-SNAP-016, REQ-SNAP-020, REQ-SNAP-021, REQ-SNAP-022, REQ-SNAP-023, REQ-SNAP-024, REQ-SNAP-025, REQ-SNAP-035, REQ-SNAP-048]

  - id: UI:mp.order_confirm.snap
    title: 下单确认 · 代切模式
    status: active
    body: |
      复用 UI:mp.order_confirm，snap 模式差异：只有一件商品；显示报价剩余有效时间（过期则按钮变「重新报价」）；
      金额区展开报价构成；提交按钮上方一个勾选「已知悉：抢到后不可取消；没抢到全额原路退款」，未勾不可提交（REQ-SNAP-037）。
      确认页认证后只读原quoteId的公开报价投影（GET /app/gz/jp/snap/order/quote/{quoteId}）：商品、三行金额、原expiresAt；不刷新报价/TTL，不显示内部汇率或加价。
    related_reqs: [REQ-SNAP-021, REQ-SNAP-036, REQ-SNAP-037]

  - id: UI:mp.order_detail.snap
    title: 订单详情 · 代切状态
    status: active
    body: |
      复用 UI:mp.order_detail。snap 行在一期履约状态之前多一段代切状态（取自 purchase_status / trade_status）：
      抢购中（自动下单中 / 对账中统一显示，不暴露「结果不明」）→ 已抢到 / 未抢到·已退款 / 人工处理中 →
      等待卖家发货 → 卖家已发货 → 已到日本仓 → 验货通过（之后接一期状态：日本仓库已发货 …）。
      抢到之后的退款态单独命名：交易取消·已退款（卖家取消 / 丢件 / 事务局取消）/ 验货未通过·已退款。
      抢购中页面 3s 轮询一次、最多 60s，之后改为手动刷新（REQ-SNAP-038）。
      到付商品退过运费差价时，金额区多一行「运费差价已退 ¥x」（取自 refund_type=shipping_diff 且已退款的退款单）；
      这行不改变商品行的状态展示（商品仍按代切 / 履约状态显示）。
      未付款created、已取消cancelled单优先显示既有资金态，不误称抢购中，也不启动采购轮询。
      mp列表/详情的snap行公共字段：snapStatus=purchasing/purchased/manual_processing/not_purchased/trade_cancelled/inspection_failed（后三态结合既有refundStatus区分已退款或处理中）；snapTradeStatus仅交易枚举白名单；shippingDiffRefundedCent只累计该行refunded的shipping_diff，batch三字段为null。不下发原purchase_status、内部报价参数、采购账号或last_error。
    related_reqs: [REQ-SNAP-004, REQ-SNAP-031, REQ-SNAP-033, REQ-SNAP-036, REQ-SNAP-038]

  - id: UI:mp.agreement.snap
    title: 用户协议 · 代切条款
    status: active
    body: |
      pages/agreement 补「代切服务」一节：抢到后不可取消、未抢到全额原路退款、到付商品预估运费多退少不补、
      商品信息来自煤炉卖家（以实物为准）、验货不通过退款。★ 文案甲方过目后定稿。
    related_reqs: [REQ-SNAP-025, REQ-SNAP-036, REQ-SNAP-037]

  - id: UI:admin.snap_purchase
    title: 代切下单（人工代买队列 + 交易看板，★ 二期店员侧最重要的页）
    status: active
    body: |
      **方案 A（Kevin 2026-10-03 选定）**：独立菜单页，顶部状态条 + 三个 tab「待人工（N）/ 交易跟踪 / 自动任务」，每 tab 一张裸 el-table + 行内操作。
      被否决：B 泳道看板（需自研）、C 并进履约看板（两种排序冲突）。
      ① 人工代买队列（manual_pending，按付款时间升序，显示入队原因 / 商品原链接 / 锁定日元价 / 到付预估运费，
      操作「填成功」（交易号 + 实际价；实际价高于锁定价不能填成功）「填失败」弹窗；入队原因 reconcile_sold 标红提示先核实是否其实买到）；
      ② 交易跟踪（success 之后按 trade_status 分组，操作「卖家已发货」「交易取消」（巡检的人工通道，待发货 / 已发货可用，
      需二次确认、会触发退款）「已到仓」（到付商品必填实际运费、提交即退差价）「已评价」「退货完成」，评价期限 12h 内置顶标红）；③ 自动下单任务只读视图（queued / executing / unknown，含对账次数与 last_error）。
      顶部状态条：自动下单开关状态 + 暂停原因 + 账号健康汇总，点进 UI:admin.snap_account。
    related_reqs: [REQ-SNAP-029, REQ-SNAP-030, REQ-SNAP-031, REQ-SNAP-032, REQ-SNAP-033, REQ-SNAP-034, REQ-SNAP-043]

  - id: UI:admin.snap_account
    title: 采购账号与自动下单开关
    status: active
    body: |
      照 gz-bean/store 范式：查询 + 裸 el-table。列 = 账号编码 / 昵称 / 健康 / 今日下单数/上限 / 最近心跳 / 停用原因；
      操作 = 启用 / 停用 / 改上限与冷却。页头一块「自动下单总开关」（开 / 关 + 暂停原因 + 恢复按钮，恢复需二次确认）+
      最近一次主动探测结果。
    related_reqs: [REQ-SNAP-030, REQ-SNAP-042, REQ-SNAP-044]

  - id: UI:admin.snap_config
    title: 代切配置（定价 / 过滤 / 准入规则 / 交易参数 / 汇率）
    status: active
    body: |
      tab 表单页，每 tab 对应一个 sys_config 键（FLOW:F-JP-11）：定价（加价比例 / 固定服务费 / 到付预估运费 / 报价有效期）、
      过滤（分类白名单 / 关键词黑名单）、准入（屏蔽词 / 拒代购词 / 转人工词）、交易（评价期限 / 巡检间隔）、
      汇率（最新汇率与来源 / 抓取时间 / 手动录入）。定价三项为空时页头红字提示「未配置，小程序无法报价」。
    related_reqs: [REQ-SNAP-019, REQ-SNAP-020, REQ-SNAP-022, REQ-SNAP-023, REQ-SNAP-025, REQ-SNAP-034, REQ-SNAP-040, REQ-SNAP-061]

  - id: UI:admin.snap_term
    title: 代切词表
    status: active
    body: |
      照 gz-bean/store 范式 CRUD：中文词 / 日文词 / 类型 / 启用 / 排序；支持按类型筛选；新增弹窗内可「试一试」——
      输入一句中文搜索词，返回替换后的日文查询串（调后端归一化接口），方便运营自测。
    related_reqs: [REQ-SNAP-014]

  - id: UI:admin.fulfill_board.snap
    title: 履约看板 · 代切行
    status: active
    body: |
      复用 UI:admin.fulfill_board。代切行带「代切」来源标签；trade_status 未到 rated 的代切行不可批量推进
      （勾选时置灰并提示「验货评价后才能推进」），rated 之后与拼团行完全同一套推进 / 发货操作。
    related_reqs: [REQ-SNAP-004, REQ-SNAP-033]
